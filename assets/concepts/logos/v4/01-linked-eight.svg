  <text x="192" y="130" fill="#FF3B5C" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" letter-spacing="3">Gen<tspan fill="#3D70FF">R</tspan><tspan fill="#5E3BBE">8</tspan></text>
