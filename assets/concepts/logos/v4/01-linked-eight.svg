  <rect x="25" y="25" width="130" height="130" rx="27" fill="#5E3BBE"/>
  <ellipse cx="90" cy="69" rx="27" ry="24" fill="none" stroke="#FF3B5C" stroke-width="10" transform="rotate(-29 90 69)"/>
  <ellipse cx="90" cy="110" rx="27" ry="24" fill="none" stroke="#3D70FF" stroke-width="10" transform="rotate(29 90 110)"/>
  <path d="m73 104 34-29" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <rect x="42" y="48" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="130" y="49" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="42" y="125" width="9" height="9" rx="2" fill="#FFFFFF"/>
