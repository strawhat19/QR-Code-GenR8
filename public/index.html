<!DOCTYPE html>
<html id="qr-document" class="qr-document" lang="en">
  <head id="qr-document-head" class="qr-document-head">
    <meta id="qr-charset-meta" class="qr-charset-meta" charset="utf-8" />
    <meta id="qr-viewport-meta" class="qr-viewport-meta" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="qr-theme-meta" class="qr-theme-meta" name="theme-color" content="#5E3BBE" />
    <meta id="qr-description-meta" class="qr-description-meta" name="description" content="A little code. A whole lot of possibility. Create free QR codes with custom colors and logos. Your links, your look, instantly." />
    <meta id="qr-color-scheme-meta" class="qr-color-scheme-meta" name="color-scheme" content="dark light" />
    <title id="qr-document-title" class="qr-document-title">QR Code GenR8 — Your links. Your look.</title>
    <link id="qr-favicon" class="qr-favicon" rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link id="qr-manifest" class="qr-manifest" rel="manifest" href="./manifest.webmanifest" />
    <link id="qr-touch-icon" class="qr-touch-icon" rel="apple-touch-icon" href="./icon-192.png" />
    <style id="qr-document-critical-styles" class="qr-document-critical-styles">
      html, body, #root { min-height: 100%; margin: 0; }
      html { background: #170F29; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body id="qr-document-body" class="qr-document-body">
    <noscript id="qr-noscript" class="qr-noscript">Enable JavaScript to create QR codes. Everything runs on your device.</noscript>
    <div id="root" class="qr-app-root"></div>
  </body>
</html>
