<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title description">
  <title id="title">QR Code GenR8 — Centered QR Link Matrix</title>
  <desc id="description">Two rounded red and blue QR finder squares and small data modules surround a centered chain link with a plain purple center and thick purple tile border.</desc>
  <rect id="qr-link-tile" x="26" y="26" width="128" height="128" rx="27" fill="#FFFFFF" stroke="#5E3BBE" stroke-width="10"/>
  <g id="qr-finder-top-right">
    <rect x="114" y="38" width="28" height="28" rx="5.90625" fill="#3D70FF"/>
    <rect x="118" y="42" width="20" height="20" rx="4.21875" fill="#FFFFFF"/>
    <rect x="122" y="46" width="12" height="12" rx="2.53125" fill="#3D70FF"/>
  </g>
  <g id="qr-finder-bottom-left">
    <rect x="38" y="114" width="28" height="28" rx="5.90625" fill="#FF3B5C"/>
    <rect x="42" y="118" width="20" height="20" rx="4.21875" fill="#FFFFFF"/>
    <rect x="46" y="122" width="12" height="12" rx="2.53125" fill="#FF3B5C"/>
  </g>
  <g id="qr-data-modules">
    <rect x="74" y="38" width="8" height="8" fill="#5E3BBE"/>
    <rect x="90" y="38" width="4" height="4" fill="#FF3B5C"/>
    <rect x="98" y="50" width="8" height="8" fill="#5E3BBE"/>
    <rect x="78" y="54" width="4" height="4" fill="#3D70FF"/>
    <rect x="38" y="78" width="8" height="8" fill="#FF3B5C"/>
    <rect x="42" y="98" width="4" height="4" fill="#5E3BBE"/>
    <rect x="134" y="78" width="8" height="8" fill="#5E3BBE"/>
    <rect x="138" y="94" width="4" height="4" fill="#3D70FF"/>
    <rect x="78" y="134" width="8" height="8" fill="#5E3BBE"/>
    <rect x="98" y="138" width="4" height="4" fill="#FF3B5C"/>
    <rect x="134" y="134" width="8" height="8" fill="#3D70FF"/>
  </g>
  <g id="qr-chain-link" transform="translate(29.14 28.8) scale(.68)">
    <path d="M64 96 51 83a18 18 0 0 1 25-25l17 17" fill="none" stroke="#FF3B5C" stroke-width="14.705882" stroke-linecap="round"/>
    <path d="M86 105l17 17a18 18 0 0 0 25-25l-13-13" fill="none" stroke="#3D70FF" stroke-width="14.705882" stroke-linecap="round"/>
    <path d="m70.5 109 38-38" fill="none" stroke="#5E3BBE" stroke-width="14.705882" stroke-linecap="round"/>
    <circle cx="89.5" cy="90" r="16" fill="#5E3BBE"/>
  </g>
</svg>
